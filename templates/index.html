<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>{{ settings.title or "사진 출력" }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>🧾 {{ settings.title or "사진 출력" }}</h1>

  <!-- 실시간 카메라 (HTTPS 필요). 갤러리 사진 출력이 필요하면 /admin 의 "출력 테스트" 사용 -->
  <section class="card">
    {% include "_post.html" %}
    <div class="row">
      <button id="capture" class="btn">촬영해서 출력</button>
    </div>
    <p class="hint">위쪽에 이름을 적으면 영수증 사진 위에 함께 찍혀요.</p>
    <p id="camErr" class="hint err" hidden></p>
  </section>

  <canvas id="canvas" hidden></canvas>

  <!-- 출력하는 동안 띄우는 로딩 창 (app.js) -->
  <div id="printing" class="modal" hidden>
    <div class="modal-box">
      <div class="spinner"></div>
      <p>출력 중…</p>
    </div>
  </div>

  <div id="status" class="status" hidden></div>

  <script src="/static/camera.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
